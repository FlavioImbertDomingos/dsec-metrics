# Encryption controls.
- id: DS-EN-01
  name: In-scope data is encrypted at rest
  owner: data-protection-lead
  description: Every in-scope data store uses encryption at rest with managed keys.
  requirements:
  - pci-dss-4.0.1:3.5.1
  - nist-csf-2.0:PR.DS-01
  - iso-27001-2022:A.8.24
  metrics:
  - KCI-01
  evidence:
  - collector: sample
    query: data_stores
    retain_days: 400
- id: DS-EN-02
  name: Data in transit is encrypted
  owner: data-protection-lead
  description: All connections that carry in-scope data use TLS.
  requirements:
  - pci-dss-4.0.1:4.2.1
  - nist-csf-2.0:PR.DS-02
  - soc2-tsc:CC6.7
  metrics: []
  evidence: []
- id: DS-EN-03
  name: Backups are encrypted
  owner: data-protection-lead
  description: Backups of in-scope stores are encrypted with separate keys.
  requirements:
  - nist-csf-2.0:PR.DS-01
  metrics: []
  evidence:
  - collector: sample
    query: data_stores
    retain_days: 400
- id: DS-EN-04
  name: Data in use is protected in memory
  owner: data-protection-lead
  description: Sensitive processing runs in hardened environments without debug access.
  requirements:
  - nist-csf-2.0:PR.DS-10
  metrics: []
  evidence: []
