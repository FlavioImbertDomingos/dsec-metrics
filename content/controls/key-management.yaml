# Key management controls.
- id: DS-KM-01
  name: Key inventory is complete and reviewed
  owner: crypto-services-lead
  description: Every key that protects account data is in the inventory with owner, algorithm and cryptoperiod.
  requirements:
  - pci-dss-4.0.1:12.3.3
  - pci-dss-4.0.1:3.6.1
  - iso-27001-2022:A.8.24
  metrics: []
  evidence:
  - collector: sample
    query: crypto_keys
    retain_days: 400
- id: DS-KM-02
  name: Keys are generated in approved modules
  owner: crypto-services-lead
  description: Keys are generated in HSMs, cloud KMS or Vault transit, never in application code.
  requirements:
  - pci-dss-4.0.1:3.7.1
  - nist-csf-2.0:PR.DS-01
  metrics: []
  evidence:
  - collector: sample
    query: crypto_keys
    retain_days: 400
- id: DS-KM-03
  name: Keys are distributed without exposure
  owner: crypto-services-lead
  description: Keys move only wrapped under a key-encryption key.
  requirements:
  - pci-dss-4.0.1:3.7.2
  metrics: []
  evidence: []
- id: DS-KM-04
  name: Keys are stored in approved stores only
  owner: crypto-services-lead
  description: Key material never sits in files, repositories or tickets.
  requirements:
  - pci-dss-4.0.1:3.7.3
  - soc2-tsc:CC6.1
  metrics: []
  evidence:
  - collector: sample
    query: crypto_keys
    retain_days: 400
- id: DS-KM-05
  name: Cryptographic keys are rotated at the end of their cryptoperiod
  owner: crypto-services-lead
  description: Keys are rotated before their cryptoperiod ends; overdue keys raise a finding.
  requirements:
  - pci-dss-4.0.1:3.7.4
  - nist-csf-2.0:PR.DS-01
  metrics:
  - KRI-04
  evidence:
  - collector: sample
    query: crypto_keys
    retain_days: 400
- id: DS-KM-06
  name: Compromised or retired keys are replaced
  owner: crypto-services-lead
  description: Keys suspected of compromise are revoked and replaced within 24 hours.
  requirements:
  - pci-dss-4.0.1:3.7.5
  metrics: []
  evidence: []
