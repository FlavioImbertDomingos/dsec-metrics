# Secrets management controls.
- id: DS-SM-01
  name: Secrets live in the secrets platform
  owner: secrets-platform-lead
  description: Application secrets are read from Vault or the cloud secrets manager at runtime.
  requirements:
  - nist-csf-2.0:PR.AA-01
  - iso-27001-2022:A.8.5
  metrics: []
  evidence:
  - collector: sample
    query: secrets_inventory
    retain_days: 400
- id: DS-SM-02
  name: Secrets are rotated on schedule
  owner: secrets-platform-lead
  description: Each secret has a rotation policy and is rotated before it lapses.
  requirements:
  - pci-dss-4.0.1:8.6.3
  - nist-csf-2.0:PR.AA-01
  metrics:
  - KRI-06
  evidence:
  - collector: sample
    query: secrets_inventory
    retain_days: 400
- id: DS-SM-03
  name: Secrets are not stored in source code
  owner: secrets-platform-lead
  description: Secret scanning blocks commits and pull requests that contain secrets.
  requirements:
  - pci-dss-4.0.1:8.6.3
  - soc2-tsc:CC8.1
  metrics: []
  evidence: []
