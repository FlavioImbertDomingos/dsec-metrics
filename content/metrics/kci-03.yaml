# Default data security metric pack. Thresholds are starting points; tune them to
# your risk appetite and record the change through review.
id: KCI-03
name: Tokenization adoption
type: kci
question: Are applications that handle card numbers using tokens instead?
owner: tokenization-lead
audience:
- management
source:
  collector: sample
  query: payment_apps
evaluation:
  kind: percentage
  filters:
  - field: handles_pan
    op: eq
    value: true
  numerator:
  - field: tokenized
    op: eq
    value: true
  group_by:
  - business_unit
frequency: monthly
thresholds:
  green:
    min: 80
  amber:
    min: 65
  red:
    below: 65
action_when_red: Agree a tokenization date with each remaining application owner.
frameworks:
- pci-dss-4.0.1:3.5.1
- iso-27001-2022:A.8.11
- nist-csf-2.0:PR.DS-01
unit: percent
higher_is_better: true
baseline:
  value: 60
  method: application inventory
  date: '2025-10-31'
target: 90
approved_by:
- data-security-manager
- technology-risk
- internal-audit
review_by: '2027-03-31'
