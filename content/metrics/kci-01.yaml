# Default data security metric pack. Thresholds are starting points; tune them to
# your risk appetite and record the change through review.
id: KCI-01
name: Encryption at rest coverage
type: kci
question: Is in-scope data encrypted wherever it is stored?
owner: data-protection-lead
audience:
- management
- risk_committee
source:
  collector: sample
  query: data_stores
evaluation:
  kind: percentage
  filters:
  - field: in_scope
    op: eq
    value: true
  numerator:
  - field: encrypted_at_rest
    op: eq
    value: true
  group_by:
  - business_unit
frequency: monthly
thresholds:
  green:
    min: 99
  amber:
    min: 97.5
  red:
    below: 97.5
action_when_red: List unencrypted stores with owners and dates; block new in-scope stores without encryption.
frameworks:
- pci-dss-4.0.1:3.5.1
- nist-csf-2.0:PR.DS-01
- iso-27001-2022:A.8.24
- soc2-tsc:CC6.1
unit: percent
higher_is_better: true
baseline:
  value: 97
  method: storage inventory
  date: '2025-10-31'
target: 100
approved_by:
- data-security-manager
- technology-risk
- internal-audit
review_by: '2027-03-31'
