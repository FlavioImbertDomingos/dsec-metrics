# Weekly grouped version updates, with a one-week cooldown on new releases.
# Security updates are not grouped, so they arrive as soon as they are published.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      python:
        applies-to: version-updates
        patterns: ["*"]
    commit-message: { prefix: "chore", include: scope }

  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    ignore:
      # The brief fixes TypeScript 5; moving to 7 is a separate decision (ADR-0001).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web:
        applies-to: version-updates
        patterns: ["*"]
    commit-message: { prefix: "chore", include: scope }

  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    ignore:
      # Build stages stay on Node 24 LTS (ADR-0001).
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      base-images:
        applies-to: version-updates
        patterns: ["*"]
    commit-message: { prefix: "chore", include: scope }

  - package-ecosystem: gomod
    directory: /deploy/docker/caddy
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      caddy:
        applies-to: version-updates
        patterns: ["*"]
    commit-message: { prefix: "chore", include: scope }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    ignore:
      # The brief fixes PostgreSQL 16. A major upgrade needs a data migration plan.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "chore", include: scope }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    cooldown: { default-days: 7 }
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
    commit-message: { prefix: "ci", include: scope }
